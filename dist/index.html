<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlatFight Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/*
VOICE    : arcade de combat, énergique mais lisible ; outils d'édition calmes et précis.
IDEA     : l'écran de sélection d'un jeu de combat — panneaux inclinés, couleurs de joueurs, gros chiffres.
PICTURE  : un vrai match CPU tourne derrière le menu titre ; ailleurs, l'aperçu du perso/stage est l'image.
COLOUR   : nuit indigo #0e1030, rouge combat #ff3d48, jaune #ffd23f, couleurs J1-J4.
TYPE     : Anton (titres), Barlow (interface) ; LAYOUT : barre en haut, trois colonnes dans les éditeurs.
*/
:root {
  color-scheme: dark;
  --bg: #0e1030; --bg2: #161a44; --panel: #1b2052; --panel2: #232a66; --line: #343c86;
  --ink: #f3f4ff; --mute: #a7acd8; --red: #ff3d48; --yellow: #ffd23f; --blue: #3d7fff; --green: #36c46b;
  --font: 'Barlow', 'Segoe UI', system-ui, sans-serif; --display: 'Anton', 'Impact', 'Arial Narrow', sans-serif;
}
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); overflow: hidden; }
#app { height: 100%; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 700; }
.muted { color: var(--mute); } .small { font-size: 13px; } .pad { padding: 0 24px; }
.warn { color: var(--yellow); font-size: 13px; }
.row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; } .row.gap { gap: 8px; margin: 6px 0; }
.col { display: flex; flex-direction: column; gap: 4px; } .grow { flex: 1; }
.scroll { overflow-x: auto; }

.screen { height: 100%; display: flex; flex-direction: column; }
.panel-screen { overflow-y: auto; background: radial-gradient(1200px 600px at 80% -10%, #2a2f7a 0%, transparent 60%), var(--bg); }

/* Boutons et champs */
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; min-height: 38px; transition: background .12s, transform .12s; }
.btn:hover { background: #2e3680; } .btn:active { transform: translateY(1px); }
.btn:focus-visible, .tool:focus-visible, .list-item:focus-visible, .menu-item:focus-visible, .char-card:focus-visible, .stage-card:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.btn.primary { background: var(--red); border-color: #ff7079; color: #fff; }
.btn.primary:hover { background: #ff5560; }
.btn.danger { background: transparent; border-color: #8a2b3a; color: #ff9aa2; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.small { padding: 4px 10px; min-height: 30px; font-size: 13px; }
.btn.big { font-size: 18px; padding: 12px 22px; }
.mini { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; min-width: 28px; height: 28px; cursor: pointer; padding: 0 6px; }
.link { background: none; border: 0; color: var(--yellow); cursor: pointer; padding: 0; text-align: left; text-decoration: underline; text-underline-offset: 2px; }
.inp { background: #0c0f2a; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); padding: 6px 8px; font: inherit; font-size: 14px; width: 100%; min-height: 32px; }
.inp:focus { outline: 2px solid var(--blue); border-color: var(--blue); }
.inp.n { width: 64px; } .inp.xs { width: 54px; padding: 4px; } .inp.wide { width: 100%; }
select.inp { cursor: pointer; }
.field { display: flex; flex-direction: column; gap: 3px; margin: 6px 0; font-size: 13px; color: var(--mute); }
.field > span { line-height: 1.2; }
.field.check { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); cursor: pointer; }
.field.check input { width: 18px; height: 18px; accent-color: var(--red); }
.field.slider { display: grid; grid-template-columns: 1fr auto; align-items: center; }
.field.slider > span { grid-column: 1 / -1; }
.field.slider input { accent-color: var(--yellow); width: 100%; }
.field.slider output { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
.field.sm { width: 96px; }
.grid2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 0 10px; }

/* Barre d'en-tête */
.bar { display: flex; align-items: center; gap: 14px; padding: 10px 18px; background: linear-gradient(90deg, #12164a, #1c2266); border-bottom: 3px solid var(--red); flex: none; flex-wrap: wrap; }
.bar h1 { font: 400 30px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
.bar .go { margin-left: auto; }
.bar-tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bar-tools select { width: auto; max-width: 200px; }

/* Navigation à la manette */
body.pad-mode :focus { outline: 4px solid var(--yellow) !important; outline-offset: 3px; }
body.pad-mode .menu-item:focus { transform: skewX(-10deg) translateX(10px); background: #2b3390; }
body.pad-mode .char-card:focus { border-color: var(--yellow); }

/* Titre */
.title { position: relative; overflow: hidden; }
.attract { position: absolute; inset: 0; width: 100%; height: 100%; filter: saturate(1.1) brightness(.55); }
.title-wrap { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: clamp(20px, 5vw, 72px); max-width: 720px; background: linear-gradient(90deg, rgba(14,16,48,.92) 55%, rgba(14,16,48,0)); overflow-y: auto; }
.logo { display: flex; flex-direction: column; line-height: .86; transform: skewX(-8deg); margin-bottom: 14px; }
.logo .l1 { overflow-wrap: anywhere; font: 400 clamp(56px, 9vw, 112px) var(--display); color: #fff; text-shadow: 6px 6px 0 var(--red); letter-spacing: .01em; }
.logo .l2 { font: 400 clamp(26px, 4vw, 46px) var(--display); color: var(--yellow); letter-spacing: .32em; margin-left: 6px; }
.tagline { font-size: 17px; color: #d6d9ff; max-width: 46ch; margin: 0 0 22px; }
.menu { display: flex; flex-direction: column; gap: 8px; max-width: 460px; }
.menu-item { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; text-align: left; border: 0; cursor: pointer; padding: 12px 20px; background: rgba(27,32,82,.92); transform: skewX(-10deg); border-left: 8px solid var(--line); transition: transform .12s, background .12s, border-color .12s; min-height: 48px; }
.menu-item > * { transform: skewX(10deg); }
.menu-item:hover, .menu-item:focus-visible { transform: skewX(-10deg) translateX(10px); background: #2b3390; }
.menu-item.red { border-left-color: var(--red); } .menu-item.yellow { border-left-color: var(--yellow); } .menu-item.blue { border-left-color: var(--blue); } .menu-item.green { border-left-color: var(--green); }
.mi-label { font: 400 26px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.mi-sub { font-size: 13px; color: var(--mute); text-align: right; }
.foot { margin-top: 18px; color: var(--mute); font-size: 13px; }

/* VS */
.versus { background: var(--bg); }
.vs-body { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 0; overflow: hidden; }
.vs-left { display: flex; flex-direction: column; padding: 14px 18px; gap: 10px; overflow-y: auto; }
.vs-right { padding: 14px 18px; background: var(--bg2); border-left: 1px solid var(--line); overflow-y: auto; }
.vs-left h2, .vs-right h2 { font: 400 22px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; margin: 6px 0 8px; }
.vs-left h2 small { font: 400 13px var(--font); text-transform: none; color: var(--mute); letter-spacing: 0; }
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.char-card { position: relative; background: linear-gradient(160deg, #2a3180, #151a48); border: 2px solid var(--line); border-radius: 6px; padding: 4px 4px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; transform: skewX(-4deg); transition: transform .1s, border-color .1s; }
.char-card:hover { border-color: var(--yellow); transform: skewX(-4deg) translateY(-2px); }
.char-card canvas { width: 96px; height: 96px; image-rendering: pixelated; }
.cc-name { font-weight: 700; font-size: 13px; text-align: center; line-height: 1.15; }
.cc-tags { position: absolute; top: 4px; left: 4px; display: flex; gap: 2px; }
.cc-tags i { font-style: normal; font-size: 11px; font-weight: 800; width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; color: #000; }
.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: auto; }
.slot { background: linear-gradient(180deg, color-mix(in srgb, var(--pc) 30%, #141846), #12163d); border: 3px solid color-mix(in srgb, var(--pc) 60%, transparent); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; align-items: stretch; gap: 4px; cursor: pointer; min-height: 250px; }
.slot.active { border-color: #fff; box-shadow: 0 0 0 3px var(--pc); }
.slot.off { background: #12163d; opacity: .75; }
.slot-head { display: flex; justify-content: space-between; align-items: center; }
.slot-head b { font: 400 26px/1 var(--display); color: var(--pc); }
.type-btn { background: var(--pc); color: #000; border: 0; border-radius: 4px; font-weight: 800; font-size: 12px; padding: 4px 10px; cursor: pointer; letter-spacing: .05em; min-height: 28px; }
.slot.off .type-btn { background: #39407e; color: #cdd0ff; }
.slot canvas { width: 100%; height: 120px; object-fit: contain; image-rendering: pixelated; }
.slot-name { font: 400 22px/1.05 var(--display); text-transform: uppercase; text-align: center; }
.slot-row { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.costume { font-size: 12px; color: var(--mute); text-align: center; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot-empty { color: var(--mute); font-size: 13px; text-align: center; margin: auto 0; }
.stage-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stage-card { background: #0c0f2a; border: 2px solid var(--line); border-radius: 6px; padding: 0 0 6px; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; text-align: center; }
.stage-card canvas { width: 100%; aspect-ratio: 16 / 9; height: auto; display: block; }
.stage-card.sel { border-color: var(--yellow); box-shadow: 0 0 0 2px var(--yellow); }
.rules { display: flex; flex-direction: column; }

/* Jeu */
.game { background: #000; position: relative; }
.game-canvas { width: 100%; height: 100%; display: block; outline: none; image-rendering: pixelated; }
.train-help { position: absolute; top: 10px; left: 10px; display: flex; gap: 12px; background: rgba(0,0,0,.55); padding: 6px 12px; border-radius: 6px; font-size: 13px; flex-wrap: wrap; }
.train-help b { color: var(--yellow); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font: 400 40px var(--display); }

/* Résultats */
.results { padding: 24px; overflow-y: auto; background: repeating-linear-gradient(-35deg, #11143e 0 40px, #141849 40px 80px); }
.res-head h1 { font: 400 clamp(40px, 7vw, 80px)/1 var(--display); text-transform: uppercase; color: var(--yellow); text-shadow: 5px 5px 0 var(--red); transform: skewX(-8deg); }
.res-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin: 24px 0; }
.res-row { background: linear-gradient(180deg, color-mix(in srgb, var(--pc) 35%, #161a48), #12163d); border: 3px solid var(--pc); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.res-row.first { transform: scale(1.04); box-shadow: 0 0 0 4px var(--yellow); }
.res-place { font: 400 54px/1 var(--display); color: #fff; }
.res-row canvas { width: 120px; height: 120px; image-rendering: pixelated; }
.res-name { font: 400 26px/1 var(--display); text-transform: uppercase; }
.res-stats { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; margin: 0; font-size: 14px; width: 100%; }
.res-stats dt { color: var(--mute); } .res-stats dd { margin: 0; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.res-actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* Cartes / bibliothèque */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.card h2 { font: 400 22px/1 var(--display); text-transform: uppercase; margin-bottom: 10px; }
.card.narrow { max-width: 520px; margin: 24px; }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; padding: 16px 24px 32px; }
.lib-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; }
.lib-card.wide { grid-column: span 1; }
.lib-card canvas { width: 100%; max-width: 240px; height: auto; aspect-ratio: auto; image-rendering: pixelated; background: #0c0f2a; border-radius: 6px; }
.lib-card b { font: 400 22px/1.1 var(--display); text-transform: uppercase; }
.lib-card small { color: var(--mute); font-size: 12px; }
.lib-card.new { justify-content: center; cursor: pointer; border-style: dashed; min-height: 200px; color: var(--mute); }
.lib-card.new:hover { border-color: var(--yellow); color: var(--ink); }
.plus { font: 400 60px/1 var(--display); color: var(--yellow); }
.lib-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: auto; }
.lib-actions .btn { padding: 4px 10px; min-height: 32px; font-size: 13px; }

/* Import */
.imp-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; padding: 16px 24px 0; }
.dropzone { border: 3px dashed var(--line); border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; background: var(--bg2); min-height: 200px; justify-content: center; }
.dropzone b { font: 400 26px/1.1 var(--display); text-transform: uppercase; }
.dropzone span { color: var(--mute); }
.dropzone.over { border-color: var(--yellow); background: #20266a; }
.imp-log { background: #090b22; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font: 13px/1.5 ui-monospace, Consolas, monospace; overflow-y: auto; max-height: 260px; min-height: 200px; color: var(--mute); }
.imp-log .ok { color: #7ef0a5; } .imp-log .bad { color: #ff9aa2; }

/* Options */
.opt-body { padding: 16px 24px 32px; display: flex; flex-direction: column; gap: 16px; }
.opt-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
table.keys { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
table.keys td { padding: 3px 0; font-size: 14px; }
table.keys td:last-child { text-align: right; }
.keycap { background: #0c0f2a; border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 6px; padding: 4px 10px; cursor: pointer; min-width: 90px; min-height: 32px; font-weight: 700; }
.keycap.wait { border-color: var(--yellow); color: var(--yellow); }
.pad-live { font-size: 13px; color: var(--mute); min-height: 20px; }
.pad-live b { color: var(--yellow); }
.pad-help { padding-left: 18px; margin: 6px 0 0; color: var(--mute); font-size: 14px; }

/* Éditeurs */
.editor { background: var(--bg); }
.ed-body { flex: 1; display: grid; grid-template-columns: 270px minmax(0, 1fr) 360px; overflow: hidden; }
.ed-left, .ed-right { background: var(--bg2); overflow-y: auto; padding: 10px 12px; }
.ed-left { border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.ed-right { border-left: 1px solid var(--line); }
.ed-list { flex: 1; overflow-y: auto; padding-top: 6px; }
.ed-center { display: flex; flex-direction: column; overflow: hidden; }
.ed-stage { flex: 1; position: relative; min-height: 200px; }
.ed-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; image-rendering: pixelated; touch-action: none; }
.ed-toolbar { display: flex; gap: 4px; padding: 6px 8px; background: #12163d; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
.tool { background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 4px 10px; cursor: pointer; min-height: 32px; font-weight: 600; font-size: 13px; }
.tool:hover { background: var(--panel2); }
.tool.on { background: var(--yellow); color: #111; }
.tool.play { background: var(--red); color: #fff; min-width: 40px; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); flex: none; }
.tab { flex: 1; background: transparent; border: 0; border-bottom: 3px solid transparent; padding: 8px 4px; cursor: pointer; font-weight: 700; color: var(--mute); min-height: 40px; }
.tab.on { color: var(--ink); border-bottom-color: var(--red); }
.list-head { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--yellow); margin: 12px 0 4px; font-weight: 700; }
.list-item { display: flex; flex-direction: column; align-items: flex-start; width: 100%; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 6px 8px; cursor: pointer; text-align: left; min-height: 40px; }
.list-item:hover { background: var(--panel); }
.list-item.on { background: var(--panel2); border-color: var(--red); }
.list-item.empty span { color: var(--mute); }
.list-item small { color: var(--mute); font-size: 12px; }
.sword { font-style: normal; color: var(--red); }
.state-row { display: grid; grid-template-columns: 1fr 120px; align-items: center; gap: 6px; padding: 3px 0; font-size: 14px; }
.panel { padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.panel h3 { font: 400 22px/1.1 var(--display); text-transform: uppercase; margin-bottom: 8px; }
.panel h4, .ed-list h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--yellow); margin: 14px 0 4px; }
table.hits { border-collapse: collapse; font-size: 12px; width: 100%; }
table.hits th { text-align: left; color: var(--mute); font-weight: 600; padding: 2px; }
table.hits td { padding: 2px; }
table.hits td .row { flex-wrap: nowrap; }
table.hits .inp { width: 52px; padding: 4px; font-size: 13px; min-height: 28px; }
table.hits .inp.xs { width: 40px; }
.angle-arrow { display: inline-block; color: var(--yellow); font-size: 14px; width: 16px; text-align: center; }
.kb-info { font-size: 12px; color: #cfd3ff; background: #0c0f2a; border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
.boxes { display: flex; flex-direction: column; gap: 4px; }
.box-row { display: grid; grid-template-columns: 64px repeat(4, minmax(0, 1fr)) 28px; gap: 3px; align-items: center; padding: 3px; border-radius: 6px; border-left: 4px solid; cursor: pointer; }
.box-row.c1 { border-color: #ff4a5a; } .box-row.c2 { border-color: #58a6ff; }
.box-row.on { background: var(--panel2); }
.box-row b { font-size: 12px; }
.box-row .inp.xs { width: 100%; }
.timeline { flex: none; background: #12163d; border-top: 1px solid var(--line); padding: 6px 8px 8px; }
.tl-info { font-size: 12px; color: var(--mute); margin-bottom: 4px; }
.tl-row { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
.tl-cell { position: relative; flex: none; width: 70px; height: 84px; background: #0c0f2a; border: 2px solid var(--line); border-radius: 6px; cursor: pointer; padding: 2px; display: flex; flex-direction: column; align-items: center; }
.tl-cell canvas { width: 64px; height: 64px; image-rendering: pixelated; }
.tl-cell.hit { border-bottom-color: var(--red); border-bottom-width: 4px; }
.tl-cell.on { border-color: var(--yellow); }
.tl-t { font-size: 11px; color: var(--mute); }
.tl-n { position: absolute; top: 2px; left: 4px; font-size: 10px; color: var(--mute); }
.tl-grp { position: absolute; top: 2px; right: 3px; background: var(--red); color: #fff; font-size: 10px; font-weight: 800; border-radius: 3px; padding: 0 4px; }
.tl-charge { position: absolute; bottom: 16px; right: 3px; background: var(--yellow); color: #000; font-size: 10px; font-weight: 800; border-radius: 3px; padding: 0 4px; }
.tl-loop { position: absolute; bottom: 16px; left: 3px; color: var(--yellow); font-size: 12px; }
.stat small { display: block; font-size: 11px; color: var(--mute); margin-top: -4px; }
.costume-row { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.costume-cv { width: 48px; height: 48px; background: #0c0f2a; border-radius: 6px; flex: none; }
ul.help { padding-left: 18px; color: var(--mute); font-size: 14px; }

/* Modales, notifications */
.modal-wrap { position: fixed; inset: 0; background: rgba(5,6,20,.7); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--red); border-radius: 12px; padding: 18px 20px; width: min(460px, 100%); max-height: 90vh; overflow-y: auto; }
.modal h2 { font: 400 26px/1.1 var(--display); text-transform: uppercase; margin-bottom: 10px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.toasts { position: fixed; bottom: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: #1f2668; border-left: 4px solid var(--green); padding: 10px 14px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.4); transition: opacity .4s, transform .4s; }
.toast.bad { border-left-color: var(--red); }
.toast.out { opacity: 0; transform: translateY(8px); }

@media (max-width: 1100px) {
  .ed-body { grid-template-columns: 230px minmax(0, 1fr) 300px; }
  .vs-body { grid-template-columns: 1fr; overflow-y: auto; }
  .vs-left { overflow: visible; }
  .vs-right { border-left: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 800px) {
  html, body { overflow: auto; }
  .ed-body { grid-template-columns: 1fr; grid-auto-rows: auto; overflow-y: auto; }
  .ed-stage { min-height: 360px; }
  .slots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .imp-grid { grid-template-columns: 1fr; }
  .title-wrap { background: rgba(14,16,48,.88); max-width: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Créer mon jeu */
.exp-status { margin: 12px 24px 0; padding: 10px 14px; background: var(--bg2); border-left: 4px solid var(--yellow); border-radius: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.exp-size { color: var(--mute); font-size: 13px; }
.exp-body { padding: 16px 24px 32px; display: flex; flex-direction: column; gap: 16px; }
.exp-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--yellow); margin: 14px 0 6px; }
.exp-logo { display: block; max-width: 100%; max-height: 140px; background: repeating-conic-gradient(#20265e 0 25%, #181d4c 0 50%) 0 0 / 16px 16px; border-radius: 8px; padding: 8px; }
.exp-logo.empty { color: var(--mute); font-size: 13px; padding: 18px; text-align: center; }
.exp-title-img { display: block; width: 100%; max-height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 6px; }
.exp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-bottom: 8px; }
.exp-grid.stages { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.exp-pick { background: #0c0f2a; border: 2px solid var(--line); border-radius: 8px; padding: 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; opacity: .55; min-height: 44px; }
.exp-pick canvas { width: 100%; height: auto; image-rendering: pixelated; }
.exp-pick.on { opacity: 1; border-color: var(--yellow); box-shadow: 0 0 0 2px var(--yellow); }

/* Écran titre d'un jeu exporté */
.title.has-image { background-size: cover; background-position: center; }
.game-logo { display: block; max-width: min(100%, 560px); max-height: 260px; object-fit: contain; margin-bottom: 14px; filter: drop-shadow(0 6px 0 rgba(0,0,0,.35)); }
.preview-banner { position: absolute; top: 12px; right: 12px; z-index: 2; display: flex; gap: 10px; align-items: center; background: rgba(0,0,0,.7); padding: 8px 12px; border-radius: 8px; border: 2px solid var(--yellow); font-weight: 700; }

</style>
